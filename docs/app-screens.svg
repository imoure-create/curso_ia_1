<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1050" viewBox="0 0 1440 1050" role="img" aria-labelledby="title desc">
  <title id="title">Pantallas principales del Gestor de Tareas ICE</title>
  <desc id="desc">Wireframe visual basado en Material UI con layout principal, listado de tareas, formulario, panel de sugerencia ICE por IA y resumen confirmado.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1f2937" flood-opacity="0.16"/>
    </filter>
    <style>
      .bg{fill:#f6f8fb}
      .surface{fill:#ffffff}
      .primary{fill:#1976d2}
      .primary-soft{fill:#e3f2fd}
      .secondary{fill:#2e7d32}
      .secondary-soft{fill:#e8f5e9}
      .warning-soft{fill:#fff8e1}
      .error-soft{fill:#ffebee}
      .text{fill:#1f2937;font-family:Arial, sans-serif;font-size:18px;font-weight:700}
      .body{fill:#4b5563;font-family:Arial, sans-serif;font-size:13px}
      .small{fill:#6b7280;font-family:Arial, sans-serif;font-size:11px}
      .button{fill:#ffffff;font-family:Arial, sans-serif;font-size:12px;font-weight:700}
      .chip{fill:#374151;font-family:Arial, sans-serif;font-size:11px;font-weight:700}
      .line{stroke:#d6dde8;stroke-width:1}
      .outline{fill:#ffffff;stroke:#d6dde8;stroke-width:1.2}
      .dash{stroke:#b6c2d2;stroke-width:1.5;stroke-dasharray:6 6;fill:none}
      .arrow{stroke:#78909c;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L8,3 z" fill="#78909c"/>
    </marker>
  </defs>

  <rect class="bg" width="1440" height="1050"/>
  <text x="48" y="54" class="text" style="font-size:28px">Gestor de Tareas ICE - estructura visual</text>
  <text x="48" y="82" class="body">Pantallas y secciones pensadas para React + Material UI, con foco en creacion, sugerencia IA y confirmacion.</text>

  <!-- Main layout -->
  <g transform="translate(48,120)" filter="url(#shadow)">
    <rect class="surface" width="640" height="390" rx="8"/>
    <rect class="primary" width="640" height="56" rx="8"/>
    <rect class="primary" y="48" width="640" height="8"/>
    <text x="24" y="35" class="button" style="font-size:17px">TasksPage / MainLayout</text>
    <circle cx="588" cy="28" r="14" fill="#ffffff" opacity="0.95"/>
    <text x="584" y="33" class="primary" style="font-family:Arial;font-size:14px;font-weight:700">+</text>

    <rect x="24" y="80" width="592" height="54" rx="6" fill="#f9fafb" stroke="#d6dde8"/>
    <text x="42" y="103" class="body" style="font-weight:700">TaskToolbar</text>
    <rect x="42" y="112" width="88" height="24" rx="12" class="primary-soft"/>
    <text x="62" y="128" class="chip">Todas</text>
    <rect x="140" y="112" width="98" height="24" rx="12" fill="#ffffff" stroke="#d6dde8"/>
    <text x="158" y="128" class="small">Pendientes</text>
    <rect x="248" y="112" width="112" height="24" rx="12" fill="#ffffff" stroke="#d6dde8"/>
    <text x="266" y="128" class="small">Completadas</text>
    <rect x="450" y="96" width="138" height="32" rx="4" fill="#ffffff" stroke="#cfd8dc"/>
    <text x="466" y="117" class="small">Orden: ICE desc</text>

    <text x="24" y="168" class="text">Listado de tareas</text>
    <g transform="translate(24,186)">
      <rect class="outline" width="592" height="74" rx="8"/>
      <rect x="16" y="18" width="10" height="38" rx="5" class="secondary"/>
      <text x="42" y="31" class="body" style="font-weight:700">Preparar demo del curso</text>
      <text x="42" y="51" class="small">Prioridad alta por impacto educativo</text>
      <rect x="380" y="18" width="72" height="26" rx="13" class="secondary-soft"/>
      <text x="400" y="35" class="chip">ICE 720</text>
      <rect x="470" y="18" width="82" height="26" rx="13" class="warning-soft"/>
      <text x="489" y="35" class="small">Pendiente</text>
      <circle cx="565" cy="31" r="4" fill="#6b7280"/>
      <circle cx="577" cy="31" r="4" fill="#6b7280"/>
      <circle cx="589" cy="31" r="4" fill="#6b7280"/>
    </g>
    <g transform="translate(24,274)">
      <rect class="outline" width="592" height="74" rx="8"/>
      <rect x="16" y="18" width="10" height="38" rx="5" class="primary"/>
      <text x="42" y="31" class="body" style="font-weight:700">Revisar documentacion MVP</text>
      <text x="42" y="51" class="small">Ajustar alcance antes de implementar</text>
      <rect x="380" y="18" width="72" height="26" rx="13" class="primary-soft"/>
      <text x="400" y="35" class="chip">ICE 480</text>
      <rect x="470" y="18" width="94" height="26" rx="13" class="secondary-soft"/>
      <text x="487" y="35" class="small">Completada</text>
    </g>
    <rect x="518" y="326" width="74" height="42" rx="21" class="primary"/>
    <text x="539" y="352" class="button">Crear</text>
  </g>

  <!-- Form dialog -->
  <g transform="translate(752,120)" filter="url(#shadow)">
    <rect class="surface" width="640" height="390" rx="8"/>
    <text x="24" y="38" class="text">TaskFormDialog</text>
    <text x="24" y="62" class="body">Crear o editar tarea</text>

    <rect x="24" y="88" width="592" height="52" rx="4" fill="#ffffff" stroke="#1976d2" stroke-width="1.4"/>
    <text x="40" y="108" class="small">Titulo *</text>
    <text x="40" y="128" class="body">Preparar retrospectiva del sprint</text>

    <rect x="24" y="158" width="592" height="96" rx="4" fill="#ffffff" stroke="#cfd8dc"/>
    <text x="40" y="178" class="small">Descripcion</text>
    <text x="40" y="202" class="body">Analizar bloqueos, extraer aprendizajes y definir acciones para mejorar el siguiente sprint.</text>
    <text x="40" y="232" class="small">Usada para calcular Impacto, Confianza y Facilidad.</text>

    <rect x="24" y="276" width="164" height="40" rx="20" class="primary"/>
    <text x="48" y="301" class="button">Calcular ICE con IA</text>
    <rect x="200" y="276" width="94" height="40" rx="20" fill="#ffffff" stroke="#cfd8dc"/>
    <text x="226" y="301" class="small" style="font-weight:700">Cancelar</text>
    <rect x="492" y="276" width="96" height="40" rx="20" class="primary"/>
    <text x="525" y="301" class="button">Guardar</text>

    <rect x="24" y="340" width="592" height="30" rx="4" class="error-soft"/>
    <text x="40" y="360" class="small">Validacion visible junto al campo o accion afectada.</text>
  </g>

  <path d="M688 315 C720 315 720 315 752 315" class="arrow"/>

  <!-- AI suggestion panel -->
  <g transform="translate(48,570)" filter="url(#shadow)">
    <rect class="surface" width="640" height="360" rx="8"/>
    <text x="24" y="38" class="text">IceSuggestionPanel</text>
    <text x="24" y="62" class="body">Revision de sugerencia generada por IA</text>

    <rect x="24" y="88" width="184" height="96" rx="8" class="primary-soft"/>
    <text x="44" y="114" class="body" style="font-weight:700">Impacto</text>
    <text x="44" y="158" class="text" style="font-size:34px">8</text>
    <rect x="44" y="168" width="124" height="6" rx="3" class="primary"/>

    <rect x="228" y="88" width="184" height="96" rx="8" class="secondary-soft"/>
    <text x="248" y="114" class="body" style="font-weight:700">Confianza</text>
    <text x="248" y="158" class="text" style="font-size:34px">7</text>
    <rect x="248" y="168" width="108" height="6" rx="3" class="secondary"/>

    <rect x="432" y="88" width="184" height="96" rx="8" class="warning-soft"/>
    <text x="452" y="114" class="body" style="font-weight:700">Facilidad</text>
    <text x="452" y="158" class="text" style="font-size:34px">6</text>
    <rect x="452" y="168" width="92" height="6" rx="3" fill="#f9a825"/>

    <rect x="24" y="208" width="592" height="58" rx="8" fill="#f9fafb" stroke="#d6dde8"/>
    <text x="44" y="232" class="body" style="font-weight:700">ICE sugerido: 336</text>
    <text x="44" y="252" class="small">La tarea tiene impacto alto, confianza media y esfuerzo moderado.</text>

    <rect x="24" y="288" width="144" height="40" rx="20" fill="#ffffff" stroke="#cfd8dc"/>
    <text x="52" y="313" class="small" style="font-weight:700">Editar valores</text>
    <rect x="184" y="288" width="148" height="40" rx="20" class="primary"/>
    <text x="216" y="313" class="button">Aceptar sugerencia</text>
    <rect x="492" y="288" width="96" height="40" rx="20" fill="#ffffff" stroke="#cfd8dc"/>
    <text x="520" y="313" class="small" style="font-weight:700">Reintentar</text>
  </g>

  <!-- Confirmed detail -->
  <g transform="translate(752,570)" filter="url(#shadow)">
    <rect class="surface" width="640" height="360" rx="8"/>
    <text x="24" y="38" class="text">TaskSummary / ConfirmedTaskView</text>
    <text x="24" y="62" class="body">Resumen tras guardar la tarea</text>

    <rect x="24" y="88" width="592" height="88" rx="8" fill="#f9fafb" stroke="#d6dde8"/>
    <text x="44" y="116" class="text" style="font-size:20px">Preparar retrospectiva del sprint</text>
    <text x="44" y="142" class="body">Estado: pendiente</text>
    <rect x="476" y="106" width="92" height="38" rx="19" class="secondary"/>
    <text x="500" y="130" class="button">ICE 336</text>

    <rect x="24" y="202" width="176" height="78" rx="8" class="primary-soft"/>
    <text x="44" y="228" class="body" style="font-weight:700">Impacto</text>
    <text x="44" y="258" class="text" style="font-size:28px">8/10</text>

    <rect x="232" y="202" width="176" height="78" rx="8" class="secondary-soft"/>
    <text x="252" y="228" class="body" style="font-weight:700">Confianza</text>
    <text x="252" y="258" class="text" style="font-size:28px">7/10</text>

    <rect x="440" y="202" width="176" height="78" rx="8" class="warning-soft"/>
    <text x="460" y="228" class="body" style="font-weight:700">Facilidad</text>
    <text x="460" y="258" class="text" style="font-size:28px">6/10</text>

    <rect x="24" y="304" width="108" height="36" rx="18" class="primary"/>
    <text x="51" y="327" class="button">Editar</text>
    <rect x="144" y="304" width="132" height="36" rx="18" fill="#ffffff" stroke="#cfd8dc"/>
    <text x="168" y="327" class="small" style="font-weight:700">Completar</text>
    <rect x="488" y="304" width="100" height="36" rx="18" fill="#ffffff" stroke="#cfd8dc"/>
    <text x="514" y="327" class="small" style="font-weight:700">Cerrar</text>
  </g>

  <path d="M370 510 C370 540 370 540 370 570" class="arrow"/>
  <path d="M688 750 C720 750 720 750 752 750" class="arrow"/>

  <!-- Component labels -->
  <g transform="translate(1020,940)">
    <rect width="324" height="56" rx="8" fill="#ffffff" stroke="#d6dde8"/>
    <circle cx="28" cy="28" r="8" class="primary"/>
    <text x="46" y="24" class="small">Componentes MUI base: AppBar, Paper, Button, TextField,</text>
    <text x="46" y="42" class="small">Chip, Alert, Dialog, Slider, Snackbar, IconButton.</text>
  </g>
</svg>
