name: Validate main PR source

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited

jobs:
  validate-source-branch:
    name: validate-source-branch
    runs-on: ubuntu-latest
    steps:
      - name: Require dev as source branch
        shell: bash
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "Pull requests targeting main must come from dev."
            exit 1
          fi
